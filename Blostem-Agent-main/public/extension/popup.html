<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Outreach Engine Ingest</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .logo-badge {
      background: #6366f1;
      color: white;
      font-weight: 900;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11px;
      outline: none;
    }
    input:focus {
      border-color: #6366f1;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.92;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status.error {
      display: block;
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">OE</div>
    <div class="title">Recruiter Ingest Copilot</div>
  </div>

  <div class="field">
    <label>App Server URL</label>
    <input type="text" id="appUrl" placeholder="http://localhost:3000">
  </div>

  <div class="field">
    <label>API Auth Token (Optional)</label>
    <input type="password" id="authToken" placeholder="Token from settings...">
  </div>

  <button id="ingestBtn" class="btn">⚡ Ingest Recruiter Profile</button>
  <div id="statusBox" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
